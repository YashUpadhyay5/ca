# =============================================================================
# Render Blueprint Specification for CaFinIQ Bank Statement Intelligence Platform
# Deploy directly to Render: https://render.com/
# =============================================================================

services:
  - type: web
    name: cafiniq-bank-statement-intelligence
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free # Zero-cost Render Free Tier
    region: oregon # Options: oregon, frankfurt, singapore, ohio
    healthCheckPath: /health
    autoDeploy: true

    envVars:
      - key: PORT
        value: 10000
      - key: PROJECT_NAME
        value: CaFinIQ - Bank Statement Intelligence Platform
      - key: SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MASK_ACCOUNTS_BY_DEFAULT
        value: true

    # OPTIONAL: Persistent Storage Disk (Requires Starter plan: $7/mo)
    # Uncomment the disk block below if using a paid plan on Render:
    # disk:
    #   name: cafiniq-data-disk
    #   mountPath: /app/storage
    #   sizeGB: 10

# Optional: Dedicated Render PostgreSQL Database (uncomment to enable)
# databases:
#   - name: cafiniq-postgres
#     plan: free # or starter
#     region: oregon
#     databaseName: cafiniq
#     user: cafiniq_user
